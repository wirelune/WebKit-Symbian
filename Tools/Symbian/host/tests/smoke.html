<!doctype html>
<meta charset="utf-8">
<title>smoke</title>
<!-- The test host's CI smoke test (ci-windows.ps1 -Step smoke): what the
     engine reports goes to the console, which the engine writes to log.txt,
     and the page is green so the screenshot shows that it painted. -->
<body style="margin:0;background:#00ff00">
<div id="out" style="font:20px sans-serif">...</div>
<script>
const results = [];
try {
    localStorage.setItem("k", "v");
    results.push("localStorage " + localStorage.getItem("k"));
} catch (e) {
    results.push("localStorage " + e);
}
const gl = document.createElement("canvas").getContext("webgl");
results.push("webgl " + (gl ? gl.getParameter(gl.VERSION) : "none"));
results.push("ua " + navigator.userAgent);
results.push("languages " + navigator.languages.join(","));
results.push("screen " + screen.width + "x" + screen.height);
// One console message per result: WTF formats a console message into a
// 256-byte buffer, so one long line would be cut off before the checks in
// ci-windows.ps1 could read it. The phone's engine truncates it the same way.
for (const line of results)
    console.log("smoke: " + line);
document.getElementById("out").textContent = results.join("\n");
</script>
